<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product List</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Poppins:wght@700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ECF0F1;
      color: #333333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* BEM Block: list-container */
    .list-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 2rem;
    }

    /* BEM Element: list-container__title */
    .list-container__title {
      font-family: 'Poppins', sans-serif;
      font-size: 2rem;
      color: #2C3E50;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* BEM Block: list */
    .list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    /* BEM Element: list__item */
    .list__item {
      background-color: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease;
    }

    .list__item:hover {
      transform: translateY(-5px);
    }

    /* BEM Element: list__item-title */
    .list__item-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.5rem;
      color: #2C3E50;
      margin-bottom: 0.5rem;
    }

    /* BEM Element: list__item-price */
    .list__item-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #3498DB;
    }

    /* BEM Block: loading */
    .loading {
      text-align: center;
      font-size: 1.2rem;
      color: #2C3E50;
      margin: 2rem 0;
    }

    /* BEM Block: skeleton */
    .skeleton {
      background-color: #e0e0e0;
      border-radius: 4px;
      height: 20px;
      margin-bottom: 0.5rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .skeleton--title {
      width: 60%;
      height: 24px;
    }

    .skeleton--price {
      width: 30%;
      height: 18px;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* BEM Block: error */
    .error {
      text-align: center;
      font-size: 1.2rem;
      color: #E74C3C;
      margin: 2rem 0;
      display: none;
    }

    /* BEM Modifier: error--visible */
    .error--visible {
      display: block;
    }

    /* Footer */
    .footer {
      background-color: #2C3E50;
      color: #ECF0F1;
      text-align: center;
      padding: 1rem;
      margin-top: auto;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .list-container {
        padding: 1rem;
      }

      .list-container__title {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <!-- List Section -->
  <section class="list-container">
    <h1 class="list-container__title">Product List</h1>
    <div class="loading" id="loading">Loading products...</div>
    <div class="error" id="error">Failed to load products. Please try again later.</div>
    <div class="list" id="product-list"></div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Online Store. All rights reserved.</p>
  </footer>

  <script>
    // DOM elements
    const productList = document.getElementById('product-list');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');

    // Create skeleton loader
    function createSkeletonLoader() {
      const skeletonItem = document.createElement('div');
      skeletonItem.classList.add('list__item');
      skeletonItem.innerHTML = `
        <div class="skeleton skeleton--title"></div>
        <div class="skeleton skeleton--price"></div>
      `;
      return skeletonItem;
    }

    // Show skeleton loaders (e.g., 3 placeholders)
    function showSkeleton() {
      productList.innerHTML = '';
      for (let i = 0; i < 3; i++) {
        productList.appendChild(createSkeletonLoader());
      }
    }

    // Fetch and render products
    async function fetchProducts() {
      loading.style.display = 'block';
      error.style.display = 'none';
      showSkeleton();

      try {
        const response = await fetch('https://fakestoreapi.com/products?limit=6');
        if (!response.ok) {
          throw new Error('Network response was not ok');
        }
        const products = await response.json();

        // Clear skeleton loaders
        productList.innerHTML = '';

        // Safely create and append DOM nodes
        products.forEach(product => {
          const item = document.createElement('div');
          item.classList.add('list__item');
          item.setAttribute('aria-label', `Product: ${product.title}`);

          const title = document.createElement('h2');
          title.classList.add('list__item-title');
          title.textContent = product.title.length > 30 ? product.title.substring(0, 27) + '...' : product.title;

          const price = document.createElement('p');
          price.classList.add('list__item-price');
          price.textContent = `$${product.price.toFixed(2)}`;

          item.appendChild(title);
          item.appendChild(price);
          productList.appendChild(item);
        });
      } catch (err) {
        console.error('Error fetching products:', err);
        productList.innerHTML = '';
        loading.style.display = 'none';
        error.style.display = 'block';
      } finally {
        if (!error.style.display === 'block') {
          loading.style.display = 'none';
        }
      }
    }

    // Initialize fetch on page load
    document.addEventListener('DOMContentLoaded', fetchProducts);
  </script>
</body>
</html>
